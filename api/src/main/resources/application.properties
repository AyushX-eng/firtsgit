# ===============================
# SERVER CONFIGURATION
# ===============================
spring.application.name=firstgit-api
server.port=${PORT:8080}

# ===============================
# FILE UPLOAD CONFIGURATION
# ===============================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ===============================
# JWT CONFIGURATION
# ===============================
# Generate a secure random key: openssl rand -base64 64
jwt.secret=${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_TO_A_64BYTE_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# ===============================
# GITHUB OAUTH2 CONFIGURATION
# ===============================
# ⚠️ For Render/Netlify deployment: Set GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET
#    as environment variables in your hosting dashboard
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,repo

# ===============================
# RATE LIMITING
# ===============================
bucket4j.enabled=false

# ===============================
# ACTUATOR (disable in production)
# ===============================
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoint.info.enabled=false

# ===============================
# SECURITY COOKIE CONFIG
# ===============================
# ⚠️ CRITICAL: Set SECURE_COOKIES=false for localhost HTTP (default).
# On Render/Netlify (HTTPS), set SECURE_COOKIES=true as env variable.
# If secure=true on HTTP, the browser silently drops ALL cookies:
#   - JSESSIONID → OAuth state is lost → "access denied session expired"
#   - firstgit_jwt → auth is never persisted → "access denied"
#
# For Render/Netlify production: add SECURE_COOKIES=true in env vars
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SECURE_COOKIES:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
