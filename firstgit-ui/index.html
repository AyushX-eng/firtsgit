<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Security Headers (CSP enforcement) -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://github.com;
      style-src 'self' 'unsafe-inline';
      img-src 'self' https://*.githubusercontent.com data:;
      connect-src 'self' http://localhost:8080 https://api.github.com;
      frame-src 'none';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      upgrade-insecure-requests;
    ">

    <title>FirstGit - Deploy to GitHub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Initial loading state -->
    <noscript>
      <div style="
        display: flex; 
        align-items: center; 
        justify-content: center; 
        height: 100vh; 
        font-family: system-ui, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      ">
        <p>JavaScript is required to run FirstGit. Please enable JavaScript in your browser.</p>
      </div>
    </noscript>
  </body>
</html>
